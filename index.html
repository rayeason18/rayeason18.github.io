<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ray</title>
<meta name="description" content="Ray 的个人主页：投资、人性、生活，用大白话聊聊。微信公众号：ray闲聊。">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 56px; font-weight: 700; letter-spacing: 0.08em; }
  .tagline { margin-top: 18px; font-size: 18px; color: #555; line-height: 1.8; }
  .tagline span { color: #999; margin: 0 8px; }
  .card {
    margin-top: 40px;
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 12px;
    padding: 24px 32px;
    max-width: 420px;
    width: 100%;
  }
  .card .label { font-size: 13px; color: #999; letter-spacing: 0.15em; }
  .card .name { margin-top: 8px; font-size: 22px; font-weight: 600; }
  .card .desc { margin-top: 8px; font-size: 15px; color: #666; line-height: 1.8; }
  .sign { margin-top: 48px; font-size: 14px; color: #aaa; letter-spacing: 0.1em; }
  footer { margin-top: 16px; font-size: 12px; color: #bbb; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    .tagline { color: #aaa; }
    .card { background: #1c1c1c; border-color: #2c2c2c; }
    .card .desc { color: #999; }
  }
</style>
</head>
<body>
  <h1>Ray</h1>
  <p class="tagline">投资<span>·</span>人性<span>·</span>生活<br>用大白话聊聊</p>
  <div class="card">
    <div class="label">微信公众号</div>
    <div class="name">ray闲聊</div>
    <div class="desc">聊投资、人性和生活。<br>不讲黑话，只说人话。</div>
  </div>
  <p class="sign">Peace &amp; Love</p>
  <footer>© 2026 Ray · ray-dev.loc.cc</footer>
</body>
</html>
